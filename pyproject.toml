[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepse-sense"
version = "0.1.0"
description = "NEPSE Sense — explainable stock scanner and Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.3",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "python-telegram-bot>=21.6",
    "apscheduler>=3.10.4",
    "matplotlib>=3.10.0",
    "typer>=0.15.1",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.3",
    "pre-commit>=4.0.1",
    "pytest-asyncio>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nepse_sense*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "S"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"nepse_sense/bot/demo.py" = ["S311"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests as requiring real network access",
]
